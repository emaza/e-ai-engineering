name: estimator

on:
  push:
    paths:
      - "estimator/**"
      - ".github/workflows/estimator.yml"
  pull_request:
    paths:
      - "estimator/**"
      - ".github/workflows/estimator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimator

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (estructura, config, contexto CAG, endpoints con LLM simulado)
        run: uv run pytest -v

      - name: Smoke test (arranca el servicio y comprueba /health y /docs)
        env:
          # Key ficticia: solo valida que el servicio arranca; no se llama al LLM
          OPENAI_API_KEY: sk-ci-dummy
          LLM_PROVIDER: openai
        run: |
          # Lanzamos uvicorn directamente desde el .venv (no con `uv run`): un proceso
          # uv vivo en segundo plano bloquea la caché y hace fallar el post-step de setup-uv
          .venv/bin/uvicorn app.main:app --port 8000 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health | grep -q '"status":"healthy"'
          curl -sf -o /dev/null http://localhost:8000/docs
          echo "✅ Servicio operativo"

  docker:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: estimator

    steps:
      - uses: actions/checkout@v5

      - name: Build de la imagen
        run: docker build -t estimator:ci .

      - name: Arranca el contenedor y comprueba que queda healthy
        run: |
          docker run -d --name estimator -p 8000:8000 \
            -e OPENAI_API_KEY=sk-ci-dummy -e LLM_PROVIDER=openai estimator:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health | grep -q '"status":"healthy"'
          test "$(docker exec estimator whoami)" = "app"     # no corre como root
          docker exec estimator test ! -e /app/.env          # sin secretos en la imagen
          echo "✅ Imagen operativa"

      - name: Logs del contenedor (si falla)
        if: failure()
        run: docker logs estimator
